<!DOCTYPE html>
<html>
<head>

    <title>Edit Category</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">
            Edit Category
        </h2>

        <form action="/update-category/{{ category.id }}"
              method="post">

            <div class="mb-3">

                <label class="form-label">
                    Category Name
                </label>

                <input type="text"
                       name="category_name"
                       value="{{ category.category_name }}"
                       class="form-control"
                       required>

            </div>

            <!-- OPTIONS -->

            <div class="form-check mb-2">

                <input class="form-check-input"
                       type="checkbox"
                       name="show_in_menu"
                       {% if category.show_in_menu %}checked{% endif %}>

                <label class="form-check-label">
                    Show In Menu
                </label>

            </div>

            <div class="form-check mb-2">

                <input class="form-check-input"
                       type="checkbox"
                       name="show_on_homepage"
                       {% if category.show_on_homepage %}checked{% endif %}>

                <label class="form-check-label">
                    Show On Homepage
                </label>

            </div>

            <div class="form-check mb-2">

                <input class="form-check-input"
                       type="checkbox"
                       name="show_in_more_menu"
                       {% if category.show_in_more_menu %}checked{% endif %}>

                <label class="form-check-label">
                    Show In More Menu
                </label>

            </div>

            <div class="form-check mb-4">

                <input class="form-check-input"
                       type="checkbox"
                       name="is_slider_category"
                       {% if category.is_slider_category %}checked{% endif %}>

                <label class="form-check-label">
                    Slider Category
                </label>

            </div>

            <button class="btn btn-success">
                Update Category
            </button>

        </form>

    </div>

</div>

</body>
</html>
