<!DOCTYPE html>
<html>
<head>

    <title>Add Category</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">
            Add Category
        </h2>

        <form action="/save-category"
              method="post">

            <div class="mb-3">

                <label class="form-label">
                    Category Name
                </label>

                <input type="text"
                       name="category_name"
                       class="form-control"
                       required>

            </div>

            <!-- OPTIONS -->

            <div class="form-check mb-2">

                <input class="form-check-input"
                       type="checkbox"
                       name="show_in_menu"
                       checked>

                <label class="form-check-label">
                    Show In Menu
                </label>

            </div>

            <div class="form-check mb-2">

                <input class="form-check-input"
                       type="checkbox"
                       name="show_on_homepage"
                       checked>

                <label class="form-check-label">
                    Show On Homepage
                </label>

            </div>

            <div class="form-check mb-2">

                <input class="form-check-input"
                       type="checkbox"
                       name="show_in_more_menu">

                <label class="form-check-label">
                    Show In More Menu
                </label>

            </div>

            <div class="form-check mb-4">

                <input class="form-check-input"
                       type="checkbox"
                       name="is_slider_category">

                <label class="form-check-label">
                    Slider Category
                </label>

            </div>

            <button class="btn btn-primary">
                Save Category
            </button>

        </form>

    </div>

</div>

</body>
</html>
